<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planificateur PCSI</title>
  <meta name="description" content="Planifie automatiquement tes devoirs, DM et révisions selon tes disponibilités." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#02030a" />

  <!-- Installation sur iPhone ("Ajouter à l'écran d'accueil") -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Planificateur" />

  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Décor d'ambiance : faisceau de lumière, fleur incandescente, rubans, particules -->
  <div class="ambient" aria-hidden="true">
    <div class="beam"></div>
    <svg class="flower" viewBox="-110 -110 220 220">
      <defs>
        <radialGradient id="petal-grad" cx="35%" cy="35%" r="75%">
          <stop offset="0" stop-color="#fff6f8" />
          <stop offset="0.5" stop-color="#ff7fa6" />
          <stop offset="1" stop-color="#d63d78" />
        </radialGradient>
      </defs>
      <g fill="url(#petal-grad)">
        <path id="petal" d="M0 0C34-14 68-58 26-100C-8-84-36-38 0 0Z" />
        <use href="#petal" transform="rotate(72)" />
        <use href="#petal" transform="rotate(144)" />
        <use href="#petal" transform="rotate(216)" />
        <use href="#petal" transform="rotate(288)" />
      </g>
    </svg>
    <svg class="ribbons" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="ribbon-grad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#ff9db9" />
          <stop offset="0.5" stop-color="#d6ecff" />
          <stop offset="1" stop-color="#6cb8ff" />
        </linearGradient>
      </defs>
      <path d="M-20 700C120 560 40 420 200 360S380 180 440 40" />
      <path d="M-20 520C100 460 220 520 260 380S300 160 420 120" />
      <path d="M60 820C160 650 300 700 340 520S260 300 120 220" />
    </svg>
    <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>
    <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>
    <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>
  </div>

  <div id="app"></div>

  <nav class="bottom-nav">
    <button class="nav-btn" data-route="#/jour" onclick="location.hash='#/jour'">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg></span>
      <span>Jour</span>
    </button>
    <button class="nav-btn" data-route="#/semaine" onclick="location.hash='#/semaine'">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4M9.5 10v11M14.5 10v11"/></svg></span>
      <span>Semaine</span>
    </button>
    <button class="nav-btn" data-route="#/ajouter" onclick="location.hash='#/ajouter'">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
      <span>Ajouter</span>
    </button>
    <button class="nav-btn" data-route="#/devoirs" onclick="location.hash='#/devoirs'">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5.5" y="4" width="13" height="17" rx="3"/><path d="M9 3h6v3.5H9zM9 11.5h6M9 15.5h4"/></svg></span>
      <span>Devoirs</span>
    </button>
    <button class="nav-btn" data-route="#/reglages" onclick="location.hash='#/reglages'">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="#02030a"/><circle cx="15.5" cy="17" r="2.4" fill="#02030a"/></svg></span>
      <span>Réglages</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
